<svg class="op-logo-mark" width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Titanium Carbon Ground -->
    <linearGradient id="opBgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="50%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Arc Reactor Cyan Pulse -->
    <linearGradient id="opCyanGrad" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Stark Pure Gold Arc -->
    <linearGradient id="opGoldGrad" x1="16" y1="12" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Titanium Metal Rim -->
    <linearGradient id="opRimGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle Optical Glow -->
    <filter id="opGlowCore" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Precision Engineered Titanium Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#opBgGrad)" stroke="url(#opRimGrad)" stroke-width="1.5" />

  <!-- Outer Orbit: Omega (Om) Arc Ring -->
  <path d="M14 32 C10.5 28.5 9 24 9 19.5 C9 11.8 15.5 6 24 6 C32.5 6 39 11.8 39 19.5 C39 24 37.5 28.5 34 32" 
        stroke="url(#opCyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Omega Base Feet -->
  <path d="M10 32.5 H15 M33 32.5 H38" stroke="url(#opCyanGrad)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Monogram P Architect: Precision Pillar + Golden Harmonic Loop -->
  <!-- Vertical Pillar -->
  <path d="M19.5 14 V34" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Harmonic Loop of P (Golden Arc Reactor) -->
  <path d="M19.5 14.2 H26.5 C30.6 14.2 33.5 16.8 33.5 20.8 C33.5 24.8 30.6 27.4 26.5 27.4 H19.5" 
        stroke="url(#opGoldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Quantum AST Core Spark -->
  <circle cx="26.5" cy="20.8" r="1.8" fill="#ffffff" filter="url(#opGlowCore)" />
</svg>